# HA script behind the "New stay" form on the Stays dashboard tab.
# Reads the form helpers, validates them and adds a timed event to
# calendar.bdl_stays (writing the `pin:` line for you), then clears the form.
#
# Helpers (Settings -> Helpers, or WS input_text/create, input_datetime/create):
#   input_select.bdl_new_stay_type     options Guest, Owner (owner visits get
#       no door PIN: the stays app writes `type: owner` and skips Access)
#   input_text.bdl_new_stay_guest      max 100
#   input_text.bdl_new_stay_pin        max 8, pattern ^(\d{4,8})?$  (blank = auto PIN)
#   input_text.bdl_new_stay_notes      max 255
#   input_datetime.bdl_new_stay_arrival   date + time
#   input_datetime.bdl_new_stay_checkout  date + time
#   binary_sensor.bdl_new_stay_ready   template helper (see READY_TEMPLATE
#       below; gates the dashboard's Create button)
#
# READY_TEMPLATE:
#   {% set owner = is_state('input_select.bdl_new_stay_type', 'Owner') %}
#   {% set g = states('input_text.bdl_new_stay_guest') | trim %}
#   {% set p = states('input_text.bdl_new_stay_pin') | trim %}
#   {% set a = as_datetime(states('input_datetime.bdl_new_stay_arrival')) %}
#   {% set c = as_datetime(states('input_datetime.bdl_new_stay_checkout')) %}
#   {{ (owner or g not in ['', 'unknown', 'unavailable'])
#      and (owner or p == '' or p is match('^\d{4,8}$'))
#      and a is not none and c is not none and c > a }}
#
# Install: Settings -> Automations & scenes -> Scripts -> new -> Edit in YAML,
# with script id `bdl_create_stay`.
alias: Create guest stay
icon: mdi:calendar-plus
mode: single
sequence:
  - variables:
      owner: "{{ is_state('input_select.bdl_new_stay_type', 'Owner') }}"
      name: "{{ states('input_text.bdl_new_stay_guest') | trim }}"
      guest: >-
        {{ 'Owner visit' if owner and name in ['', 'unknown', 'unavailable']
           else name }}
      pin: "{{ '' if owner else states('input_text.bdl_new_stay_pin') | trim }}"
      notes: "{{ states('input_text.bdl_new_stay_notes') | trim }}"
      arrival: "{{ states('input_datetime.bdl_new_stay_arrival') }}"
      checkout: "{{ states('input_datetime.bdl_new_stay_checkout') }}"
  - if:
      - condition: template
        value_template: "{{ not owner and guest in ['', 'unknown', 'unavailable'] }}"
    then:
      - stop: Enter the guest name.
        error: true
  - if:
      - condition: template
        value_template: "{{ pin != '' and not (pin is match('^\\d{4,8}$')) }}"
    then:
      - stop: The PIN must be 4 to 8 digits, or blank for an automatic one.
        error: true
  - if:
      - condition: template
        value_template: >-
          {{ as_datetime(arrival) is none or as_datetime(checkout) is none
             or as_datetime(checkout) <= as_datetime(arrival) }}
    then:
      - stop: Checkout must be after arrival.
        error: true
  - action: calendar.create_event
    target:
      entity_id: calendar.bdl_stays
    data:
      summary: "{{ guest }}"
      start_date_time: "{{ arrival }}"
      end_date_time: "{{ checkout }}"
      description: >-
        {{ ((['type: owner'] if owner else [])
            + (['pin: ' ~ pin] if pin else []) + ([notes] if notes else []))
           | join('\n') }}
  - action: input_select.select_option
    target:
      entity_id: input_select.bdl_new_stay_type
    data:
      option: Guest
  - action: input_text.set_value
    target:
      entity_id:
        - input_text.bdl_new_stay_guest
        - input_text.bdl_new_stay_pin
        - input_text.bdl_new_stay_notes
    data:
      value: ""
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bdl_new_stay_arrival
    data:
      datetime: "{{ (today_at('16:00') + timedelta(days=1)).strftime('%Y-%m-%d %H:%M:00') }}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bdl_new_stay_checkout
    data:
      datetime: "{{ (today_at('11:00') + timedelta(days=3)).strftime('%Y-%m-%d %H:%M:00') }}"
