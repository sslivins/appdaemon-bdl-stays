# Lovelace view for the BDL dashboard: guest stays, door PINs and the
# calendar they come from. Paste under `views:` of the dashboard (raw
# configuration editor) or add as a new view in YAML mode.
#
# Entities: calendar.bdl_stays (Local Calendar "BDL Stays"),
# sensor.bdl_stay_current, sensor.bdl_stay_next (published by AppDaemon
# app bdl_stays; see README for attributes).
title: Stays
path: stays
icon: mdi:calendar-account
type: sections
max_columns: 2
sections:
  - type: grid
    cards:
      - type: heading
        heading: Current stay
        icon: mdi:home-account
      - type: markdown
        content: |-
          {% set s = 'sensor.bdl_stay_current' %}
          {% if states(s) in ['none', 'unknown', 'unavailable'] %}
          No guests right now.
          {% else %}
          {% set f = '%a %b %-d, %-I:%M %p' %}
          ## {{ state_attr(s, 'guest') }}

          - **Arrival:** {{ as_timestamp(state_attr(s, 'arrival')) | timestamp_custom(f) }}
          - **Checkout:** {{ as_timestamp(state_attr(s, 'checkout')) | timestamp_custom(f) }}
          {%- if state_attr(s, 'owner') %}
          - **Owner visit:** no door PIN; the hub signs itself in
          {%- else %}
          - **Door PIN:** {{ state_attr(s, 'pin') or '—' }} ({{ state_attr(s, 'pin_source') }})
          - **Door access:** {{ state_attr(s, 'access_status') }}, {{ as_timestamp(state_attr(s, 'access_start')) | timestamp_custom(f) }} → {{ as_timestamp(state_attr(s, 'access_end')) | timestamp_custom(f) }}
          {%- endif %}
          {%- if state_attr(s, 'notes') %}
          - **Notes:** {{ state_attr(s, 'notes') }}
          {%- endif %}
          {%- if state_attr(s, 'last_error') %}

          ⚠️ {{ state_attr(s, 'last_error') }}
          {%- endif %}
          {% endif %}
      - type: heading
        heading: Next stay
        icon: mdi:calendar-account
      - type: markdown
        content: |-
          {% set s = 'sensor.bdl_stay_next' %}
          {% if states(s) in ['none', 'unknown', 'unavailable'] %}
          No upcoming stays.
          {% else %}
          {% set f = '%a %b %-d, %-I:%M %p' %}
          ## {{ state_attr(s, 'guest') }}

          - **Arrival:** {{ as_timestamp(state_attr(s, 'arrival')) | timestamp_custom(f) }} (in {{ time_until(as_datetime(state_attr(s, 'arrival'))) }})
          - **Checkout:** {{ as_timestamp(state_attr(s, 'checkout')) | timestamp_custom(f) }}
          {%- if state_attr(s, 'owner') %}
          - **Owner visit:** no door PIN; the hub signs itself in
          {%- else %}
          - **Door PIN:** {{ state_attr(s, 'pin') or '—' }} ({{ state_attr(s, 'pin_source') }})
          - **Door access:** {{ state_attr(s, 'access_status') }}, {{ as_timestamp(state_attr(s, 'access_start')) | timestamp_custom(f) }} → {{ as_timestamp(state_attr(s, 'access_end')) | timestamp_custom(f) }}
          {%- endif %}
          {%- if state_attr(s, 'notes') %}
          - **Notes:** {{ state_attr(s, 'notes') }}
          {%- endif %}
          {%- if state_attr(s, 'last_error') %}

          ⚠️ {{ state_attr(s, 'last_error') }}
          {%- endif %}
          {% endif %}
      - type: entities
        title: Stay sync
        show_header_toggle: false
        entities:
          - entity: sensor.bdl_stay_current
            name: Current guest
          - entity: sensor.bdl_stay_next
            name: Next guest
          - type: attribute
            entity: sensor.bdl_stay_next
            attribute: access_mode
            name: UniFi Access
            icon: mdi:door-closed-lock
          - type: attribute
            entity: sensor.bdl_stay_next
            attribute: modes_enabled
            name: Heat automation (bdl_modes)
            icon: mdi:radiator
  - type: grid
    cards:
      - type: heading
        heading: New stay
        icon: mdi:calendar-plus
      - type: entities
        show_header_toggle: false
        state_color: false
        entities:
          - entity: input_select.bdl_new_stay_type
            name: Stay type
            icon: mdi:account-question
          - entity: input_text.bdl_new_stay_guest
            name: Guest name (optional for owner visits)
            icon: mdi:account
          - entity: input_datetime.bdl_new_stay_arrival
            name: Arrival
            icon: mdi:car-arrow-right
          - entity: input_datetime.bdl_new_stay_checkout
            name: Checkout
            icon: mdi:car-arrow-left
          - type: conditional
            conditions:
              - entity: input_select.bdl_new_stay_type
                state: Guest
            row:
              entity: input_text.bdl_new_stay_pin
              name: Door PIN (blank = automatic)
              icon: mdi:dialpad
          - entity: input_text.bdl_new_stay_notes
            name: Notes (optional)
            icon: mdi:note-text-outline
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.bdl_new_stay_ready
            state: "on"
        card:
          type: button
          name: Create stay
          icon: mdi:calendar-plus
          show_state: false
          tap_action:
            action: perform-action
            perform_action: script.bdl_create_stay
            confirmation:
              text: Add this stay to the BDL Stays calendar?
        grid_options:
          rows: 1
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.bdl_new_stay_ready
            state_not: "on"
        card:
          type: markdown
          content: >-
            {% set owner = is_state('input_select.bdl_new_stay_type', 'Owner') %}
            {% set g = states('input_text.bdl_new_stay_guest') | trim %}
            {% set p = states('input_text.bdl_new_stay_pin') | trim %}
            {% set a = as_datetime(states('input_datetime.bdl_new_stay_arrival')) %}
            {% set c = as_datetime(states('input_datetime.bdl_new_stay_checkout')) %}
            {% if not owner and g in ['', 'unknown', 'unavailable'] %}Enter the guest name.
            {% elif not owner and p != '' and not (p is match('^\d{4,8}$')) %}The PIN must be 4–8 digits (or blank for an automatic one).
            {% elif a is none or c is none or c <= a %}Checkout must be after arrival.
            {% endif %}
      - type: heading
        heading: Calendar
        icon: mdi:calendar
      - type: markdown
        content: >-
          To change or cancel a stay, click it in the calendar below. Stays
          can also be added there directly: title = guest name, all-day
          events arrive 4 PM / leave 11 AM, optional description line
          `pin: 4821` (4–8 digits), or `type: owner` for an owner visit
          (no door PIN); other lines are notes.
      - type: calendar
        initial_view: dayGridMonth
        entities:
          - calendar.bdl_stays
        grid_options:
          columns: full
